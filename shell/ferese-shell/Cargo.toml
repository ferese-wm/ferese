[package]
name = "ferese-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
fff-search = "=0.11.0"
mime_guess = "2.0.5"
ferese-activities = { path = "../../crates/ferese-activities" }
ferese-layout = { path = "../../crates/ferese-layout" }
ferese-panel = { path = "../../crates/ferese-panel" }
ferese-animation = { path = "../../crates/ferese-animation" }
ferese-theme-client = { path = "../../crates/ferese-theme-client" }
ferese-ipc = { path = "../../crates/ferese-ipc" }
ferese-theme = { path = "../../crates/ferese-theme" }
ferese-config = { path = "../../crates/ferese-config" }
ferese-protocols = { path = "../../crates/ferese-protocols", default-features = false, features = ["client"] }
jiff.workspace = true
libc.workspace = true
# Prefer GPU rendering, retaining software rendering as a fallback/override.
libcosmic = { workspace = true, features = ["wgpu", "a11y"] }
freedesktop-desktop-entry = { version = "0.8.3", default-features = false }
iced_accessibility.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["time", "rt", "sync", "net", "macros"] }
wayland-client.workspace = true
zbus = "5.19.0"
pipewire = { version = "0.10.1", features = ["v0_3_65"] }
image-codec = { package = "image", version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
url = "2.5.8"
base64 = "0.22.1"
sha2 = "0.11"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }

[dev-dependencies]
wayland-server.workspace = true
ferese-protocols = { path = "../../crates/ferese-protocols", features = ["server"] }
