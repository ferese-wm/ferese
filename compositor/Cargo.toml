[package]
name = "ferese"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ferese-shape.workspace = true
ferese-config = { path = "../crates/ferese-config" }
ab_glyph = "0.2.32"
fontdb = "0.23.0"
calloop.workspace = true
ferese-animation = { path = "../crates/ferese-animation" }
ferese-core = { path = "../crates/ferese-core" }
ferese-ipc = { path = "../crates/ferese-ipc" }
ferese-layout = { path = "../crates/ferese-layout" }
ferese-protocols = { path = "../crates/ferese-protocols", features = ["server"] }
futures-lite = "2.6.1"
libc.workspace = true
jiff.workspace = true
notify = "8.2.0"
zbus = "5.19.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
memmap2 = "0.9.11"
smithay.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
xcursor.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
# Opt-in counters/histograms with a per-client exit summary.
resize-metrics = []
