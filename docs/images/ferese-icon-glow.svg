      <stop offset="0" stop-color="#DFFFFF" stop-opacity="0.90"/>
      <stop offset="1" stop-color="#B9F3FF" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="edge-right" gradientUnits="userSpaceOnUse" x1="514" y1="912" x2="1090" y2="390">
