      <stop offset="0" stop-color="#7CEBFF"/>
      <stop offset="0.48" stop-color="#46C8FF"/>
      <stop offset="1" stop-color="#10A6FF"/>
    </linearGradient>
    <linearGradient id="ferese-orbit-right" gradientUnits="userSpaceOnUse" x1="356" y1="857" x2="1073" y2="410">
      <stop offset="0" stop-color="#1BC3FF"/>
      <stop offset="0.52" stop-color="#1788FF"/>
      <stop offset="1" stop-color="#1B42F0"/>
